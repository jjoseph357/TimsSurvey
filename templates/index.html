<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Survey Automator</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #C8102E;
            --dq: #2f7de1;
            --accent: #FFD700;
            --ok: #4cd964;
            --bad: #ff4d6d;
            --glass-border: rgba(255, 255, 255, 0.2);
            --text-light: #ffffff;
            --text-dim: #cccccc;
            --bg-gradient: linear-gradient(135deg, #1a1a1a 0%, #2d1b1e 50%, #1a1a1a 100%);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background: var(--bg-gradient);
            background-attachment: fixed;
            color: var(--text-light);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            padding: 20px 16px;
            overflow-x: hidden;
        }

        .container {
            width: 100%;
            max-width: 480px;
        }

        .panel {
            background: rgba(30, 30, 30, 0.7);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 28px 22px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        .header {
            text-align: center;
            margin-bottom: 24px;
        }

        .logo {
            font-size: 30px;
            font-weight: 700;
            letter-spacing: -1px;
        }

        .subtitle {
            font-size: 14px;
            color: var(--text-dim);
            font-weight: 300;
        }

        .counter-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(200, 16, 46, 0.2);
            border: 1px solid rgba(200, 16, 46, 0.3);
            padding: 6px 14px;
            border-radius: 50px;
            font-size: 13px;
            font-weight: 600;
            margin-top: 12px;
            color: #ff8fa3;
        }

        .counter-badge span {
            color: white;
        }

        .helper-text {
            text-align: center;
            color: var(--text-dim);
            font-size: 13px;
            margin-bottom: 10px;
        }

        .input-group {
            position: relative;
            margin-bottom: 14px;
        }

        .code-input {
            width: 100%;
            background: rgba(0, 0, 0, 0.3);
            border: 2px solid var(--glass-border);
            border-radius: 16px;
            padding: 18px 16px 26px;
            font-family: 'Outfit', monospace;
            font-size: 19px;
            color: white;
            text-align: center;
            letter-spacing: 1.5px;
            outline: none;
            transition: border-color 0.2s;
        }

        .code-input:focus {
            border-color: var(--primary);
        }

        .code-input::placeholder {
            color: rgba(255, 255, 255, 0.3);
            font-size: 15px;
            letter-spacing: 0.5px;
        }

        .detected {
            position: absolute;
            left: 0;
            right: 0;
            bottom: 7px;
            text-align: center;
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 0.5px;
            color: var(--text-dim);
        }

        .btn {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 16px;
            font-family: 'Outfit', sans-serif;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            background: var(--primary);
            color: white;
            box-shadow: 0 4px 15px rgba(200, 16, 46, 0.4);
        }

        .btn:active {
            transform: scale(0.98);
        }

        .jobs {
            margin-top: 18px;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .job {
            background: rgba(30, 30, 30, 0.75);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 16px;
            animation: fadeIn 0.3s ease;
        }

        .job.done {
            border-color: rgba(76, 217, 100, 0.5);
        }

        .job.failed {
            border-color: rgba(255, 77, 109, 0.5);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .job-head {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .site {
            font-size: 11px;
            font-weight: 700;
            padding: 3px 8px;
            border-radius: 6px;
            background: var(--primary);
            flex-shrink: 0;
        }

        .site.dq {
            background: var(--dq);
        }

        .job-code {
            font-family: Consolas, monospace;
            font-size: 12px;
            color: var(--text-dim);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            flex: 1;
        }

        .dismiss {
            background: none;
            border: none;
            color: var(--text-dim);
            font-size: 20px;
            line-height: 1;
            cursor: pointer;
            padding: 0 4px;
        }

        .job-status {
            font-size: 13px;
            color: var(--text-dim);
            margin: 10px 0 8px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .job.failed .job-status {
            color: var(--bad);
            white-space: normal;
        }

        .bar {
            background: rgba(255, 255, 255, 0.1);
            height: 5px;
            border-radius: 10px;
            overflow: hidden;
        }

        .bar div {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, var(--primary), #ff4d6d);
            transition: width 0.5s ease;
        }

        .job.dq .bar div {
            background: linear-gradient(90deg, var(--dq), #7fb2ff);
        }

        .job.done .bar,
        .job.failed .bar {
            display: none;
        }

        .result {
            display: none;
            text-align: center;
        }

        .job.done .result,
        .job.failed .result {
            display: block;
        }

        .val-code {
            display: block;
            width: 100%;
            background: none;
            border: none;
            font-family: 'Outfit', sans-serif;
            font-size: 38px;
            font-weight: 700;
            color: var(--accent);
            letter-spacing: 3px;
            margin: 6px 0 2px;
            cursor: pointer;
            word-break: break-all;
        }

        .val-hint {
            font-size: 11px;
            color: var(--text-dim);
        }

        .code-crop {
            display: block;
            max-width: 100%;
            margin: 12px auto 0;
            border-radius: 8px;
        }

        .full-link {
            display: inline-block;
            margin-top: 10px;
            font-size: 13px;
            color: var(--text-dim);
        }

        .empty {
            text-align: center;
            color: var(--text-dim);
            font-size: 13px;
            margin-top: 18px;
        }

        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: rgba(30, 30, 30, 0.95);
            padding: 12px 22px;
            border-radius: 50px;
            font-size: 14px;
            border: 1px solid var(--glass-border);
            opacity: 0;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 1000;
            max-width: calc(100% - 32px);
        }

        .toast.active {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }

        .toast.error {
            border-color: var(--bad);
            color: var(--bad);
        }

        .toast.success {
            border-color: var(--ok);
            color: var(--ok);
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="panel">
            <div class="header">
                <div class="logo">Survey Automator</div>
                <div class="subtitle">Tim Hortons &amp; Dairy Queen, in parallel</div>
                <div class="counter-badge">Total Completed: <span id="counter-value">...</span></div>
            </div>

            <div class="helper-text">Enter a receipt code, press Start, then enter the next one</div>
            <div class="input-group">
                <input type="text" id="codeInput" class="code-input" placeholder="Tims 21 digits or DQ 15 characters"
                    autocomplete="off" autocapitalize="characters" spellcheck="false">
                <div class="detected" id="detected"></div>
            </div>
            <button id="startBtn" class="btn">Start Survey</button>
        </div>

        <div class="jobs" id="jobs"></div>
        <div class="empty" id="empty">Surveys you start will appear here.</div>
    </div>

    <div id="toast" class="toast"></div>

    <script>
        const codeInput = document.getElementById('codeInput');
        const detectedEl = document.getElementById('detected');
        const jobsEl = document.getElementById('jobs');
        const emptyEl = document.getElementById('empty');
        const counterValue = document.getElementById('counter-value');
        const SITE_NAMES = { tims: 'Tim Hortons', dq: 'Dairy Queen' };
        const cards = {};
        let pollTimer = null;

        // Mirrors sites.detect_site: Tims = 21 digits, DQ = 15 letters/digits (never the letter O).
        function detectSite(raw) {
            const code = raw.replace(/[\s-]/g, '').toUpperCase().replace(/O/g, '0');
            if (/^\d{21}$/.test(code)) return 'tims';
            if (/^[A-Z0-9]{15}$/.test(code)) return 'dq';
            return null;
        }

        function splitCodes(text) {
            // Several codes can be pasted at once, separated by commas, semicolons or new lines.
            return text.split(/[,;\n]+/).map(c => c.trim()).filter(Boolean);
        }

        codeInput.addEventListener('input', () => {
            const raw = codeInput.value;
            const digits = raw.replace(/\D/g, '');
            // Dash-format pure-digit Tims codes as they're typed: 0000-0000-0000-0000-00000
            if (!/[,;\n]/.test(raw) && /^[\d-\s]*$/.test(raw) && digits.length <= 21) {
                codeInput.value = digits.replace(/^(\d{4})(\d{0,4})?(\d{0,4})?(\d{0,4})?(\d{0,5})?$/,
                    (_, ...g) => g.slice(0, 5).filter(Boolean).join('-'));
            } else {
                codeInput.value = raw.toUpperCase();
            }
            const codes = splitCodes(codeInput.value);
            const sites = codes.map(detectSite);
            detectedEl.textContent = codes.length > 1
                ? `${sites.filter(Boolean).length} of ${codes.length} codes recognized`
                : sites[0] ? SITE_NAMES[sites[0]] : '';
        });

        codeInput.addEventListener('keydown', e => {
            if (e.key === 'Enter') start();
        });
        document.getElementById('startBtn').addEventListener('click', start);

        async function start() {
            const codes = splitCodes(codeInput.value);
            if (!codes.length || !codes.every(detectSite)) {
                showToast('Enter a 21-digit Tims code or a 15-character DQ code', 'error');
                codeInput.focus();
                return;
            }
            codeInput.value = '';
            detectedEl.textContent = '';
            codeInput.focus();
            try {
                const resp = await fetch('/api/start', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ codes })
                });
                const data = await resp.json();
                if (!resp.ok) throw new Error(data.error || 'Failed to start');
                if (data.errors && data.errors.length) showToast(data.errors.join('; '), 'error');
                refresh();
            } catch (err) {
                codeInput.value = codes.join(', ');
                showToast(err.message || 'Network error', 'error');
            }
        }

        function makeCard(job) {
            const el = document.createElement('div');
            el.className = `job ${job.site}`;
            el.innerHTML = `
                <div class="job-head">
                    <span class="site ${job.site}">${SITE_NAMES[job.site]}</span>
                    <span class="job-code"></span>
                    <button class="dismiss" title="Dismiss">&times;</button>
                </div>
                <div class="job-status"></div>
                <div class="bar"><div></div></div>
                <div class="result">
                    <button class="val-code"></button>
                    <div class="val-hint">Write this on your receipt &middot; tap to copy</div>
                    <a class="crop-link" target="_blank"><img class="code-crop" alt="Validation code on the survey page"></a>
                    <a class="full-link" target="_blank">Open full screenshot</a>
                </div>`;
            el.querySelector('.job-code').textContent = job.code;
            el.querySelector('.dismiss').addEventListener('click', async () => {
                await fetch('/api/jobs/' + job.id, { method: 'DELETE' });
                el.remove();
                delete cards[job.id];
                updateEmpty();
            });
            el.querySelector('.val-code').addEventListener('click', e => {
                const text = e.currentTarget.textContent;
                if (navigator.clipboard) navigator.clipboard.writeText(text).then(() => showToast('Copied ' + text, 'success'));
            });
            jobsEl.prepend(el);
            return el;
        }

        function updateCard(el, job) {
            const finished = job.state === 'done' || job.state === 'failed';
            el.classList.toggle('done', job.state === 'done');
            el.classList.toggle('failed', job.state === 'failed');
            el.querySelector('.dismiss').style.display = finished ? '' : 'none';
            el.querySelector('.job-status').textContent =
                job.state === 'done' ? (job.result_code ? 'Survey complete' : 'Complete, but no code was read. Check the screenshot.') : job.status;
            el.querySelector('.bar div').style.width = job.progress + '%';

            const valCode = el.querySelector('.val-code');
            valCode.textContent = job.result_code || '';
            valCode.style.display = job.result_code ? '' : 'none';
            el.querySelector('.val-hint').style.display = job.result_code ? '' : 'none';

            const crop = el.querySelector('.code-crop');
            const full = el.querySelector('.full-link');
            const cropLink = el.querySelector('.crop-link');
            const fullSrc = job.image ? '/api/screenshot/' + job.image : null;
            if (job.code_image && crop.dataset.src !== job.code_image) {
                crop.dataset.src = job.code_image;
                crop.src = '/api/screenshot/' + job.code_image;
            }
            crop.style.display = job.code_image ? '' : 'none';
            cropLink.href = fullSrc || '#';
            full.href = fullSrc || '#';
            full.style.display = fullSrc ? '' : 'none';
        }

        function updateEmpty() {
            emptyEl.style.display = Object.keys(cards).length ? 'none' : '';
        }

        async function refresh() {
            clearTimeout(pollTimer);
            try {
                const data = await (await fetch('/api/jobs')).json();
                counterValue.textContent = data.global_counter;
                for (const job of data.jobs) {
                    const wasFinished = cards[job.id] && cards[job.id].classList.contains('done');
                    cards[job.id] = cards[job.id] || makeCard(job);
                    updateCard(cards[job.id], job);
                    if (!wasFinished && job.state === 'done' && job.result_code && pollTimer !== null) {
                        showToast(`${SITE_NAMES[job.site]} code: ${job.result_code}`, 'success');
                    }
                }
                updateEmpty();
                const active = data.jobs.some(j => j.state === 'queued' || j.state === 'running');
                pollTimer = setTimeout(refresh, active ? 1000 : 5000);
            } catch (e) {
                pollTimer = setTimeout(refresh, 3000);
            }
        }

        let toastTimer;
        function showToast(message, type = '') {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.className = `toast active ${type}`;
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => toast.classList.remove('active'), 3000);
        }

        refresh();
    </script>
</body>

</html>
