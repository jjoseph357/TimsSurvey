<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TellTims Automator</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #C8102E;
            /* Tim Hortons Red */
            --primary-dark: #9e0e26;
            --accent: #FFD700;
            --glass-bg: rgba(255, 255, 255, 0.1);
            --glass-border: rgba(255, 255, 255, 0.2);
            --text-light: #ffffff;
            --text-dim: #cccccc;
            --bg-gradient: linear-gradient(135deg, #1a1a1a 0%, #2d1b1e 50%, #1a1a1a 100%);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background: var(--bg-gradient);
            color: var(--text-light);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow-x: hidden;
        }

        /* Ambient Background Animation */
        body::before {
            content: '';
            position: fixed;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(200, 16, 46, 0.15) 0%, transparent 60%);
            animation: pulse 10s infinite alternate;
            z-index: -1;
            pointer-events: none;
        }

        @keyframes pulse {
            0% {
                transform: scale(1);
                opacity: 0.5;
            }

            100% {
                transform: scale(1.2);
                opacity: 0.8;
            }
        }

        .container {
            width: 100%;
            max-width: 480px;
            background: rgba(30, 30, 30, 0.7);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 40px 30px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            transform: translateY(0);
            transition: transform 0.3s ease;
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
        }

        .logo {
            font-size: 32px;
            font-weight: 700;
            margin-bottom: 10px;
            background: linear-gradient(45deg, #fff, #f0f0f0);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -1px;
        }

        .subtitle {
            font-size: 14px;
            color: var(--text-dim);
            font-weight: 300;
        }

        .counter-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(200, 16, 46, 0.2);
            border: 1px solid rgba(200, 16, 46, 0.3);
            padding: 8px 16px;
            border-radius: 50px;
            font-size: 13px;
            font-weight: 600;
            margin-top: 15px;
            color: #ff8fa3;
        }

        .counter-badge span {
            color: white;
            font-weight: 700;
        }

        .input-group {
            position: relative;
            margin-bottom: 30px;
        }

        .code-input {
            width: 100%;
            background: rgba(0, 0, 0, 0.3);
            border: 2px solid var(--glass-border);
            border-radius: 16px;
            padding: 20px;
            font-family: 'Outfit', monospace;
            /* Monospace for alignment */
            font-size: 20px;
            color: white;
            text-align: center;
            letter-spacing: 2px;
            transition: all 0.3s ease;
            outline: none;
        }

        .code-input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(200, 16, 46, 0.2);
            transform: translateY(-2px);
        }

        .code-input::placeholder {
            color: rgba(255, 255, 255, 0.3);
            letter-spacing: 1px;
            font-size: 16px;
        }

        .helper-text {
            text-align: center;
            color: var(--text-dim);
            font-size: 13px;
            margin-bottom: 10px;
        }

        .btn {
            width: 100%;
            padding: 18px;
            border: none;
            border-radius: 16px;
            font-family: 'Outfit', sans-serif;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
        }

        .btn-primary {
            background: var(--primary);
            color: white;
            box-shadow: 0 4px 15px rgba(200, 16, 46, 0.4);
        }

        .btn-primary:active {
            transform: scale(0.98);
        }

        .btn-primary::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(rgba(255, 255, 255, 0.2), transparent);
            opacity: 0;
            transition: opacity 0.3s;
        }

        .btn-primary:hover::after {
            opacity: 1;
        }

        .btn-secondary {
            background: transparent;
            border: 1px solid var(--glass-border);
            color: var(--text-dim);
            margin-top: 15px;
        }

        .btn-secondary:hover {
            border-color: var(--text-light);
            color: var(--text-light);
        }

        /* Progress & Status */
        .progress-container {
            display: none;
            margin-top: 30px;
        }

        .progress-bar-bg {
            background: rgba(255, 255, 255, 0.1);
            height: 6px;
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 20px;
        }

        .progress-bar-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--primary), #ff4d6d);
            width: 0%;
            border-radius: 10px;
            transition: width 0.5s ease;
            box-shadow: 0 0 10px var(--primary);
        }

        .status-text {
            text-align: center;
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 20px;
            min-height: 27px;
        }

        .logs-box {
            background: rgba(0, 0, 0, 0.4);
            border-radius: 12px;
            padding: 15px;
            height: 150px;
            overflow-y: auto;
            font-family: 'Consolas', monospace;
            font-size: 12px;
            color: #aaa;
            border: 1px solid var(--glass-border);
            margin-bottom: 20px;
        }

        .logs-box div {
            margin-bottom: 6px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            padding-bottom: 4px;
        }

        .logs-box div:last-child {
            color: var(--text-light);
            border-bottom: none;
        }

        /* Scrollbar for logs */
        .logs-box::-webkit-scrollbar {
            width: 6px;
        }

        .logs-box::-webkit-scrollbar-track {
            background: transparent;
        }

        .logs-box::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 10px;
        }

        /* Results */
        .result-container {
            display: none;
            text-align: center;
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .success-icon {
            font-size: 48px;
            margin-bottom: 15px;
            display: block;
        }

        .validation-code {
            font-size: 28px;
            font-weight: 700;
            color: var(--accent);
            margin: 20px 0;
            letter-spacing: 2px;
            text-shadow: 0 0 20px rgba(255, 215, 0, 0.3);
        }

        .receipt-image {
            width: 100%;
            max-height: 400px;
            object-fit: contain;
            border-radius: 12px;
            border: 1px solid var(--glass-border);
            margin: 20px 0;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        /* Loading Spinner */
        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            border-top-color: var(--primary);
            animation: spin 0.8s ease-in-out infinite;
            margin: 20px auto;
            display: none;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: rgba(30, 30, 30, 0.9);
            padding: 12px 24px;
            border-radius: 50px;
            font-size: 14px;
            border: 1px solid var(--glass-border);
            opacity: 0;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 1000;
            display: flex;
            align-items: center;
            gap: 10px;
            white-space: nowrap;
        }

        .toast.active {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }

        .toast.error {
            border-color: #ff4d6d;
            color: #ff4d6d;
        }

        .toast.success {
            border-color: #4cd964;
            color: #4cd964;
        }
    </style>
</head>

<body>

    <div class="container">
        <!-- Header -->
        <div class="header">
            <div class="logo">TellTims Automator</div>
            <div class="subtitle">Complete surveys in seconds</div>

            <div class="counter-badge">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
                    <polyline points="22 4 12 14.01 9 11.01"></polyline>
                </svg>
                Total Completed: <span id="counter-value">...</span>
            </div>
        </div>

        <!-- Input Section -->
        <div id="input-section">
            <div class="helper-text">Enter the 21-digit receipt code</div>
            <div class="input-group">
                <input type="text" id="codeInput" class="code-input" placeholder="0000-0000-0000-0000-00000"
                    maxlength="26" inputmode="numeric">
            </div>

            <button id="startBtn" class="btn btn-primary">Start Survey</button>
            <div class="spinner" id="btn-spinner"></div>
        </div>

        <!-- Progress Section -->
        <div id="progress-container" class="progress-container">
            <div class="status-text" id="status-text">Initializing...</div>
            <div class="progress-bar-bg">
                <div id="progress-bar" class="progress-bar-fill"></div>
            </div>
            <div class="logs-box" id="logs-area"></div>
        </div>

        <!-- Result Section -->
        <div id="result-container" class="result-container">
            <div class="success-icon">🎉</div>
            <h2>Survey Complete!</h2>
            <div class="helper-text">Write this code on your receipt</div>
            <div id="validation-code" class="validation-code">--------</div>

            <a id="result-link" href="#" target="_blank">
                <img id="result-image" class="receipt-image" src="" alt="Survey Result">
            </a>

            <button onclick="location.reload()" class="btn btn-primary">Done</button>
        </div>
    </div>

    <!-- Toast Notification -->
    <div id="toast" class="toast">
        <span id="toast-icon"></span>
        <span id="toast-message"></span>
    </div>

    <script>
        // DOM Elements
        const startBtn = document.getElementById('startBtn');
        const codeInput = document.getElementById('codeInput');
        const inputSection = document.getElementById('input-section');
        const progressContainer = document.getElementById('progress-container');
        const progressBar = document.getElementById('progress-bar');
        const statusText = document.getElementById('status-text');
        const logsArea = document.getElementById('logs-area');
        const resultContainer = document.getElementById('result-container');
        const resultImage = document.getElementById('result-image');
        const resultLink = document.getElementById('result-link');
        const counterValue = document.getElementById('counter-value');
        const btnSpinner = document.getElementById('btn-spinner');
        const validationCodeEl = document.getElementById('validation-code');
        const toast = document.getElementById('toast');

        let pollInterval = null;
        let currentSessionId = null;

        // --- Event Listeners ---

        // Auto-format input
        codeInput.addEventListener('input', (e) => {
            let value = e.target.value.replace(/\D/g, '');
            if (value.length > 21) value = value.slice(0, 21);

            let formatted = '';
            for (let i = 0; i < value.length; i++) {
                if (i > 0 && i % 4 === 0 && i < 17) formatted += '-';
                formatted += value[i];
            }
            e.target.value = formatted;
        });

        startBtn.addEventListener('click', async () => {
            const rawCode = codeInput.value;
            const cleanCode = rawCode.replace(/-/g, '');

            if (cleanCode.length < 21) {
                showToast('Please enter a valid 21-digit code', 'error');
                codeInput.focus();
                // Add shake animation
                codeInput.style.transform = "translateX(5px)";
                setTimeout(() => codeInput.style.transform = "translateX(0)", 100);
                setTimeout(() => codeInput.style.transform = "translateX(-5px)", 200);
                setTimeout(() => codeInput.style.transform = "translateX(0)", 300);
                return;
            }

            // UI Transition
            startBtn.style.display = 'none';
            btnSpinner.style.display = 'block';
            codeInput.disabled = true;

            try {
                const response = await fetch('/api/start', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ code: cleanCode })
                });

                const data = await response.json();

                if (data.success) {
                    currentSessionId = data.session_id;
                    transitionToProgress();
                    startPolling();
                } else {
                    showToast(data.error || 'Failed to start', 'error');
                    resetUI();
                }
            } catch (error) {
                showToast(error.message || 'Network error', 'error');
                resetUI();
            }
        });

        // --- Functions ---

        function transitionToProgress() {
            inputSection.style.display = 'none';
            progressContainer.style.display = 'block';
            // Smooth scroll to top if needed on mobile
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function resetUI() {
            startBtn.style.display = 'block';
            btnSpinner.style.display = 'none';
            codeInput.disabled = false;
        }

        function startPolling() {
            let attempts = 0;
            const maxAttempts = 300;

            pollInterval = setInterval(async () => {
                attempts++;
                if (attempts > maxAttempts) {
                    stopPolling();
                    showToast('Survey timed out', 'error');
                    resetUI();
                    return;
                }

                try {
                    if (!currentSessionId) return;
                    const response = await fetch('/api/status?session_id=' + currentSessionId);
                    const data = await response.json();

                    // Update Progress
                    progressBar.style.width = data.progress + '%';
                    statusText.textContent = data.status;

                    // Update Logs
                    if (data.logs && data.logs.length > 0) {
                        const isAtBottom = logsArea.scrollHeight - logsArea.scrollTop === logsArea.clientHeight;
                        logsArea.innerHTML = data.logs.map(log => `<div>> ${log}</div>`).join('');
                        if (isAtBottom) logsArea.scrollTop = logsArea.scrollHeight;
                    }

                    // Update Counter if available
                    if (data.global_counter !== undefined) {
                        counterValue.textContent = data.global_counter;
                    }

                    // Check for completion
                    if (data.image) {
                        stopPolling();
                        showResult(data);
                    }

                } catch (e) {
                    console.error("Polling error", e);
                }
            }, 1000);
        }

        function stopPolling() {
            if (pollInterval) clearInterval(pollInterval);
        }

        function showResult(data) {
            progressContainer.style.display = 'none';
            resultContainer.style.display = 'block';

            const imageSrc = '/api/screenshot/' + data.image + '?t=' + new Date().getTime();
            resultImage.src = imageSrc;
            resultLink.href = imageSrc;

            if (data.result_code) {
                validationCodeEl.textContent = data.result_code;
                showToast('Survey Completed Successfully!', 'success');
            } else {
                validationCodeEl.textContent = "See Screenshot";
            }
        }

        function showToast(message, type = 'normal') {
            const toastMsg = document.getElementById('toast-message');
            const toastIcon = document.getElementById('toast-icon');

            toastMsg.textContent = message;
            toastIcon.textContent = type === 'error' ? '⚠️' : type === 'success' ? '✅' : 'ℹ️';

            toast.className = `toast active ${type}`;

            setTimeout(() => {
                toast.classList.remove('active');
            }, 3000);
        }

        // Initial fetch for counter
        fetch('/api/status?session_id=init_check')
            .then(r => r.json())
            .then(d => {
                if (d.global_counter) counterValue.textContent = d.global_counter;
            })
            .catch(() => counterValue.textContent = '...');

    </script>
</body>

</html>
