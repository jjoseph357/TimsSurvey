services:
  - type: web
    name: telltims-automator
    env: python
    buildCommand: |
      pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.0
      - key: CHROME_BIN
        value: /usr/bin/chromium-browser
